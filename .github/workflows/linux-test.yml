name: Linux Sandbox Test

on:
  push:
    branches: [linux-support]
  pull_request:
    branches: [linux-support]

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install bubblewrap and socat
        run: sudo apt-get install -y bubblewrap socat

      - name: Build LD_PRELOAD deny library
        run: |
          gcc -shared -fPIC -o target/libcato_deny.so src/sandbox/preload/deny_open.c -ldl
          echo "Built libcato_deny.so"

      - name: Check kernel version (need 5.13+ for Landlock)
        run: |
          uname -r
          cat /proc/version

      - name: Check bubblewrap version
        run: bwrap --version

      - name: Check if Landlock is available
        run: |
          if [ -f /sys/kernel/security/landlock/status ]; then
            echo "Landlock available:"
            cat /sys/kernel/security/landlock/status
          else
            echo "Landlock not available via sysfs, checking kernel config..."
            grep LANDLOCK /boot/config-$(uname -r) 2>/dev/null || echo "Cannot determine Landlock status"
          fi

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Test bwrap basic isolation
        run: |
          echo "=== Test: bwrap basic namespace isolation ==="
          bwrap \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /bin /bin \
            --ro-bind /sbin /sbin \
            --ro-bind /etc /etc \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --unshare-pid \
            --die-with-parent \
            -- /bin/echo "bwrap works"

      - name: Test bwrap filesystem isolation
        run: |
          echo "=== Test: filesystem isolation ==="
          TESTDIR=$(mktemp -d)
          echo "secret" > "$TESTDIR/secret.env"
          echo "normal" > "$TESTDIR/normal.txt"

          # Workspace visible, /home hidden
          bwrap \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /bin /bin \
            --ro-bind /sbin /sbin \
            --ro-bind /etc /etc \
            --proc /proc \
            --dev /dev \
            --bind "$TESTDIR" "$TESTDIR" \
            --tmpfs /home \
            --unshare-pid \
            --die-with-parent \
            --chdir "$TESTDIR" \
            -- /bin/sh -c '
              echo "workspace read: $(cat normal.txt)"
              echo "write test:"
              echo "written" > write-test.txt && cat write-test.txt
              echo "home hidden:"
              ls /home/ 2>&1 || echo "  (empty/hidden)"
            '
          rm -rf "$TESTDIR"

      - name: Test bwrap network isolation
        run: |
          echo "=== Test: network namespace isolation ==="
          # With --unshare-net, network should be blocked
          EXIT=0
          bwrap \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /bin /bin \
            --ro-bind /sbin /sbin \
            --ro-bind /etc /etc \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --unshare-pid \
            --unshare-net \
            --die-with-parent \
            -- /bin/sh -c 'curl -s --max-time 3 https://example.com > /dev/null 2>&1' || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: network blocked (exit $EXIT)"
          else
            echo "FAIL: network should be blocked"
            exit 1
          fi

      - name: Test cato init
        run: |
          echo "=== Test: cato init ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          $GITHUB_WORKSPACE/target/release/cato init
          cat .cato.toml
          rm -rf "$TESTDIR"

      - name: Test cato run (basic command)
        run: |
          echo "=== Test: cato run -- echo hello ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          deny_read = ["*.env"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF
          CATO_DEBUG=1 $GITHUB_WORKSPACE/target/release/cato run -- /bin/echo "sandbox works on linux" 2>&1
          rm -rf "$TESTDIR"

      - name: Test cato deny_read enforcement
        run: |
          echo "=== Test: deny_read on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          deny_read = ["*.env", "*.key"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF
          echo "SECRET=leaked" > .env
          echo "normal" > test.txt

          # Normal file should be readable
          $GITHUB_WORKSPACE/target/release/cato run -- cat test.txt

          # .env should be blocked (exit non-zero)
          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- cat .env 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: .env blocked (exit $EXIT)"
          else
            echo "FAIL: .env should be blocked"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test cato network blocking
        run: |
          echo "=== Test: network deny-by-default on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = []
          [sandbox.options]
          allow_localhost = true
          EOF

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- curl -s --max-time 5 https://example.com 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: network blocked with empty list (exit $EXIT)"
          else
            echo "FAIL: network should be blocked"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test cato home directory isolation
        run: |
          echo "=== Test: home dir hidden on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- ls $HOME/Documents 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: home dir hidden (exit $EXIT)"
          else
            echo "FAIL: home should be hidden"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test cato deny_write enforcement
        run: |
          echo "=== Test: deny_write on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          deny_write = ["*.lock"]
          deny_read = ["*.env"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF
          echo "existing" > yarn.lock

          # Normal write should work
          $GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'echo ok > normal.txt'
          echo "PASS: normal write allowed"

          # Writing to existing .lock file should be blocked (ro-bind)
          EXIT=0
          CATO_DEBUG=1 $GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'echo modified > yarn.lock' 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: deny_write *.lock blocked (exit $EXIT)"
          else
            echo "FAIL: *.lock write should be blocked"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test cato deny_read .key files
        run: |
          echo "=== Test: deny_read *.key on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          deny_read = ["*.env", "*.key", "*.pem"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF
          echo "PRIVATE" > secret.key
          echo "CERT" > server.pem

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- cat secret.key 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: .key blocked (exit $EXIT)"
          else
            echo "FAIL: .key should be blocked"
            exit 1
          fi

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- cat server.pem 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: .pem blocked (exit $EXIT)"
          else
            echo "FAIL: .pem should be blocked"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test cato .cato.toml protection
        run: |
          echo "=== Test: .cato.toml tamper-proof on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'echo hacked >> .cato.toml' 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: .cato.toml write blocked (exit $EXIT)"
          else
            echo "FAIL: .cato.toml should be protected"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test CATO_SANDBOX env var
        run: |
          echo "=== Test: CATO_SANDBOX env on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF

          OUTPUT=$($GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'echo $CATO_SANDBOX' 2>/dev/null)
          if [ "$OUTPUT" = "1" ]; then
            echo "PASS: CATO_SANDBOX=1"
          else
            echo "FAIL: CATO_SANDBOX should be 1 (got: $OUTPUT)"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test exit code forwarding
        run: |
          echo "=== Test: exit code forwarding on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'exit 0' 2>/dev/null || EXIT=$?
          if [ $EXIT -eq 0 ]; then
            echo "PASS: exit 0 forwarded"
          else
            echo "FAIL: exit 0 not forwarded (got $EXIT)"
            exit 1
          fi

          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'exit 42' 2>/dev/null || EXIT=$?
          if [ $EXIT -eq 42 ]; then
            echo "PASS: exit 42 forwarded"
          else
            echo "FAIL: exit 42 not forwarded (got $EXIT)"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test raw bwrap socat bridge
        timeout-minutes: 1
        run: |
          echo "=== Test: raw socat bridge inside bwrap --unshare-net ==="
          SOCK="/tmp/cato-test-bridge.sock"

          # Start a simple TCP server on host port 9999
          socat TCP-LISTEN:9999,fork,reuseaddr SYSTEM:'echo HTTP/1.1 200 OK; echo; echo BRIDGE_WORKS' &
          SERVER_PID=$!
          sleep 0.2

          # Bridge: Unix socket → TCP 9999
          socat UNIX-LISTEN:$SOCK,fork,reuseaddr TCP:127.0.0.1:9999 &
          BRIDGE_PID=$!
          sleep 0.2

          # Inside bwrap with --unshare-net: socat TCP-LISTEN → Unix socket
          OUTPUT=$(bwrap \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /bin /bin \
            --ro-bind /sbin /sbin \
            --ro-bind /etc /etc \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --bind $SOCK $SOCK \
            --unshare-pid \
            --unshare-net \
            --die-with-parent \
            -- /bin/sh -c "
              echo 'lo status:' && ip link show lo 2>&1 || true
              echo 'trying socat bridge...'
              socat TCP-LISTEN:3128,fork,reuseaddr UNIX-CONNECT:$SOCK &
              sleep 0.3
              curl -s --proxy http://127.0.0.1:3128 --max-time 5 http://example.com 2>&1 || echo 'curl failed'
              kill %1 2>/dev/null
            " 2>&1) || true

          echo "$OUTPUT"
          kill $BRIDGE_PID $SERVER_PID 2>/dev/null || true
          rm -f $SOCK

          if echo "$OUTPUT" | grep -q "BRIDGE_WORKS"; then
            echo "PASS: socat bridge works inside --unshare-net"
          else
            echo "INFO: socat bridge did not work — loopback may be down"
            echo "  Checking if ip link set lo up helps..."

            # Try again with explicit lo up
            socat TCP-LISTEN:9998,fork,reuseaddr SYSTEM:'echo HTTP/1.1 200 OK; echo; echo BRIDGE_V2' &
            SERVER_PID=$!
            SOCK2="/tmp/cato-test-bridge2.sock"
            socat UNIX-LISTEN:$SOCK2,fork,reuseaddr TCP:127.0.0.1:9998 &
            BRIDGE_PID=$!
            sleep 0.2

            OUTPUT2=$(bwrap \
              --ro-bind /usr /usr \
              --ro-bind /lib /lib \
              --ro-bind /lib64 /lib64 \
              --ro-bind /bin /bin \
              --ro-bind /sbin /sbin \
              --ro-bind /etc /etc \
              --proc /proc \
              --dev /dev \
              --tmpfs /tmp \
              --bind $SOCK2 $SOCK2 \
              --unshare-user \
              --unshare-pid \
              --unshare-net \
              --die-with-parent \
              -- /bin/sh -c "
                ip link set lo up 2>&1 || echo 'ip link set lo up failed'
                socat TCP-LISTEN:3128,fork,reuseaddr UNIX-CONNECT:$SOCK2 &
                sleep 0.3
                curl -s --proxy http://127.0.0.1:3128 --max-time 5 http://example.com 2>&1 || echo 'curl failed v2'
                kill %1 2>/dev/null
              " 2>&1) || true

            echo "$OUTPUT2"
            kill $BRIDGE_PID $SERVER_PID 2>/dev/null || true
            rm -f $SOCK2

            if echo "$OUTPUT2" | grep -q "BRIDGE_V2"; then
              echo "PASS: socat bridge works with --unshare-user + ip link set lo up"
            else
              echo "FAIL: socat bridge not working"
            fi
          fi

      - name: Test network domain filtering (proxy)
        run: |
          echo "=== Test: network domain filtering on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = ["example.com"]
          [sandbox.options]
          allow_localhost = true
          EOF

          # Allowed domain should work
          OUTPUT=$($GITHUB_WORKSPACE/target/release/cato run -- curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://example.com 2>/dev/null)
          if [ "$OUTPUT" = "200" ]; then
            echo "PASS: example.com allowed (200)"
          else
            echo "FAIL: example.com should return 200 (got: $OUTPUT)"
            exit 1
          fi

          # Blocked domain should fail
          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- curl -s -o /dev/null -w "%{http_code}" --max-time 5 https://google.com 2>/dev/null || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: google.com blocked (exit $EXIT)"
          else
            echo "FAIL: google.com should be blocked"
            exit 1
          fi
          rm -rf "$TESTDIR"

      - name: Test deny_read blocks NEW files (LD_PRELOAD)
        run: |
          echo "=== Test: deny_read on newly created files ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          deny_read = ["*.env", "*.key"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF

          # Copy the preload library next to the cato binary
          cp $GITHUB_WORKSPACE/target/libcato_deny.so $GITHUB_WORKSPACE/target/release/libcato_deny.so 2>/dev/null || true

          # Create a NEW .env inside sandbox and try to read it
          # LD_PRELOAD should block the read even though file didn't exist at start
          EXIT=0
          $GITHUB_WORKSPACE/target/release/cato run -- /bin/sh -c 'echo "NEW_SECRET=x" > fresh.env; cat fresh.env' 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "PASS: new .env file blocked by LD_PRELOAD (exit $EXIT)"
          else
            echo "INFO: LD_PRELOAD not active or not blocking new files (exit $EXIT)"
            echo "  (this is expected if libcato_deny.so was not built)"
          fi
          rm -rf "$TESTDIR"

      - name: Test ephemeral mode
        run: |
          echo "=== Test: ephemeral mode on Linux ==="
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          cat > .cato.toml << 'EOF'
          [sandbox]
          allow_write = ["{workspace}", "/tmp"]
          network = ["*"]
          [sandbox.options]
          allow_localhost = true
          EOF
          echo "original" > eph-file.txt

          $GITHUB_WORKSPACE/target/release/cato run --ephemeral -- /bin/sh -c 'echo modified > eph-file.txt; echo new > eph-new.txt' 2>/dev/null

          CONTENT=$(cat "$TESTDIR/eph-file.txt")
          if [ "$CONTENT" = "original" ]; then
            echo "PASS: ephemeral — original unchanged"
          else
            echo "FAIL: ephemeral — file was modified (got: $CONTENT)"
            exit 1
          fi

          if [ ! -f "$TESTDIR/eph-new.txt" ]; then
            echo "PASS: ephemeral — new file not persisted"
          else
            echo "FAIL: ephemeral — new file leaked"
            exit 1
          fi
          rm -rf "$TESTDIR"

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Run smoke tests
        run: chmod +x tests/smoke_test.sh && ./tests/smoke_test.sh
