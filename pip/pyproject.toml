[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cato-cli-py"
version = "0.4.0"
description = "Portable sandbox for secure command execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Harikrishna Reddy" }
]
keywords = ["sandbox", "security", "cli", "seatbelt", "isolation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Harikrishnareddyl/cato"
Repository = "https://github.com/Harikrishnareddyl/cato"

[project.scripts]
cato = "cato_cli.wrapper:main"

[tool.setuptools.packages.find]
include = ["cato_cli*"]
