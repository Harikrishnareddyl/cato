[package]
name = "cato-cli"
version = "0.5.2"
edition = "2021"
description = "Portable sandbox for secure command execution"
license = "MIT"
repository = "https://github.com/Harikrishnareddyl/cato"
keywords = ["ai", "safety", "security", "cli"]

[[bin]]
name = "cato"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "5"
ctrlc = "3"

[dev-dependencies]
tempfile = "3.27.0"
